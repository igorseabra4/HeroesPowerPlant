name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - '*'

jobs:
  release-windows:
    runs-on: windows-latest
    name: Windows x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: ./Publish.ps1
        shell: pwsh

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.zip
